# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Until a custom domain is attached this is a preview: it is served from
# https://<owner>.github.io/<repository>/, marked noindex, and its canonical URL
# still names the production site.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), all optional:
#   CUSTOM_DOMAIN           e.g. conpriquo-solutions.in. Set it only once the domain's DNS
#                           points at GitHub Pages: the site is then built for that domain
#                           at the root and becomes the indexable production site.
#   PUBLIC_FORM_ENDPOINT    URL that receives enquiries as a JSON POST. Without it the
#                           form hands the request to the visitor's own email app.
#   PUBLIC_FORM_ACCESS_KEY  public key for form services that ask for one.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.CUSTOM_DOMAIN && '/' || github.event.repository.name }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_FORM_ACCESS_KEY: ${{ vars.PUBLIC_FORM_ACCESS_KEY }}

      # The built site is committed on top of the gh-pages branch, which GitHub Pages
      # serves. The branch is never force-pushed.
      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf out
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" out
          else
            mkdir out
            git -C out init --quiet --initial-branch gh-pages
            git -C out remote add origin "$remote"
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. out/
          # Without this file GitHub Pages would skip the _astro folder.
          touch out/.nojekyll
          # This branch holds built files only: Vercel, which deploys from main, skips it.
          printf '{ "git": { "deploymentEnabled": false } }\n' > out/vercel.json
          if [ -n "${CUSTOM_DOMAIN}" ]; then echo "${CUSTOM_DOMAIN}" > out/CNAME; fi
          cd out
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed since the last deployment."
            exit 0
          fi
          git commit --quiet -m "Deploy ${GITHUB_SHA}"
          git push --quiet origin gh-pages
